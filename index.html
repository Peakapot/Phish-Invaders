<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHISH INVADERS</title>
<style>
  /* ============================================================
     STYLES — retro neon-on-black arcade look
     ============================================================ */
  :root {
    --bg: #0a0a0f;
    --cyan: #00f0ff;
    --magenta: #ff2fd0;
    --lime: #7CFC00;
    --red: #ff3b3b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: "Courier New", Consolas, Menlo, monospace;
    cursor: default;
  }

  /* Center the game stage and letterbox it */
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at center, #11111a 0%, #05050a 100%);
  }

  #wrap {
    position: relative;
    /* internal resolution aspect ratio 4:3 (640x800 -> portrait) */
    aspect-ratio: 640 / 800;
    height: 100%;
    max-width: 100%;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }

  /* CRT scanline overlay */
  #crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.18) 4px
      );
    mix-blend-mode: multiply;
  }
  /* Vignette + subtle flicker layer */
  #flicker {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    animation: flick 4.5s infinite steps(60);
    opacity: 0.9;
  }
  @keyframes flick {
    0%, 100% { opacity: 0.88; }
    47%      { opacity: 0.92; }
    48%      { opacity: 0.80; }
    49%      { opacity: 0.93; }
    72%      { opacity: 0.85; }
    73%      { opacity: 0.95; }
  }

  /* Mute button (HTML overlay so it's always clickable) */
  #mute {
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 10;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 8px;
    cursor: pointer;
    text-shadow: 0 0 6px var(--cyan);
    box-shadow: 0 0 8px rgba(0,240,255,0.4);
    user-select: none;
  }
  #mute:hover { background: rgba(0,240,255,0.12); }

  /* Restart button on game-over (HTML overlay, centered) */
  #restartBtn {
    position: absolute;
    left: 50%;
    bottom: 14%;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    background: rgba(0,0,0,0.5);
    border: 2px solid var(--magenta);
    color: var(--magenta);
    font-family: inherit;
    font-weight: bold;
    font-size: 22px;
    letter-spacing: 2px;
    padding: 12px 26px;
    cursor: pointer;
    text-shadow: 0 0 10px var(--magenta);
    box-shadow: 0 0 18px rgba(255,47,208,0.6);
    animation: pulse 1.2s infinite ease-in-out;
  }
  #restartBtn:hover { background: rgba(255,47,208,0.18); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 18px rgba(255,47,208,0.5); }
    50%     { box-shadow: 0 0 30px rgba(255,47,208,0.95); }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="crt"></div>
      <div id="flicker"></div>
      <button id="mute" title="Toggle sound (M)">🔊 SOUND</button>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>

<script>
"use strict";
/* ================================================================
   PHISH INVADERS
   A single-file neon arcade phishing-awareness game.

   Sections:
     1. Config & internal resolution
     2. State
     3. Audio (Web Audio API, generated SFX)
     4. Input
     5. Entities & spawning
     6. Update (game logic, delta-time)
     7. Render (player, emails, particles, HUD, screens)
     8. Main loop & boot
   ================================================================ */

/* ----------------------------------------------------------------
   1. CONFIG & INTERNAL RESOLUTION
   Fixed internal resolution; canvas is scaled by CSS to fit window.
   ---------------------------------------------------------------- */
const VW = 640;            // virtual width
const VH = 800;            // virtual height

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Render at device pixel ratio for crispness, but keep a fixed coordinate
// system of VW x VH via ctx scaling.
function setupCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = VW * dpr;
  canvas.height = VH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
setupCanvas();
window.addEventListener("resize", setupCanvas);

const COLORS = {
  bg:      "#0a0a0f",
  cyan:    "#00f0ff",
  magenta: "#ff2fd0",
  lime:    "#7CFC00",
  red:     "#ff3b3b",
  white:   "#eafcff",
  amber:   "#ffcc33",
};

// Tunable difficulty knobs
const CFG = {
  player: { w: 56, h: 26, speed: 460, y: VH - 64 },
  bullet: { w: 5, h: 16, speed: 720, cooldown: 0.22 },
  email:  { w: 40, h: 30 },
  spawn:  { startInterval: 1.25, minInterval: 0.42, rampPerSec: 0.0075 },
  fall:   { startSpeed: 70, maxSpeed: 240, rampPerSec: 1.6 },
  greenChance: 0.40,         // fraction of spawns that are legit (green)
  comboCap: 5,
  startLives: 3,
};

/* ----------------------------------------------------------------
   2. STATE
   ---------------------------------------------------------------- */
const SCREEN = { TITLE: "title", PLAY: "play", OVER: "over" };

let state = {
  screen: SCREEN.TITLE,
  score: 0,
  high: 0,
  combo: 0,            // consecutive red hits
  lives: CFG.startLives,
  time: 0,             // seconds since run start (drives difficulty ramp)
  spawnTimer: 0,
  fireTimer: 0,
  flash: 0,            // red screen flash intensity (0..1)
  flashText: 0,        // timer for "FALSE POSITIVE!" text
  shake: 0,            // screen shake intensity
  newHigh: false,
  muted: false,
};

let emails = [];
let bullets = [];
let particles = [];
let stars = [];        // background drifting stars

const HS_KEY = "phishInvadersHighScore";
function loadHigh() {
  const v = parseInt(localStorage.getItem(HS_KEY) || "0", 10);
  state.high = Number.isFinite(v) ? v : 0;
}
function saveHigh() {
  try { localStorage.setItem(HS_KEY, String(state.high)); } catch (e) {}
}
loadHigh();

/* ----------------------------------------------------------------
   3. AUDIO — generated SFX via Web Audio API (no files)
   ---------------------------------------------------------------- */
const Audio = (() => {
  let actx = null;
  function ensure() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }

  // Generic tone with envelope
  function tone({ freq = 440, type = "square", dur = 0.12, vol = 0.2,
                  slideTo = null, attack = 0.005, release = 0.06 }) {
    if (state.muted) return;
    const ac = ensure();
    if (!ac) return;
    const t0 = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo != null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + release + 0.02);
  }

  // Noise burst (for buzzer/explosion texture)
  function noise({ dur = 0.18, vol = 0.18, hp = 400 }) {
    if (state.muted) return;
    const ac = ensure();
    if (!ac) return;
    const t0 = ac.currentTime;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filt = ac.createBiquadFilter();
    filt.type = "highpass";
    filt.frequency.value = hp;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt).connect(gain).connect(ac.destination);
    src.start(t0);
    src.stop(t0 + dur);
  }

  return {
    unlock: ensure,
    shoot()  { tone({ freq: 720, type: "square", dur: 0.08, vol: 0.12, slideTo: 1200, release: 0.04 }); },
    hitRed(combo) {
      // satisfying pop, rising with combo
      const base = 320 + Math.min(combo, 6) * 60;
      tone({ freq: base, type: "triangle", dur: 0.10, vol: 0.22, slideTo: base * 2.2, release: 0.08 });
      noise({ dur: 0.08, vol: 0.10, hp: 800 });
    },
    hitGreen() {
      // harsh buzzer
      tone({ freq: 180, type: "sawtooth", dur: 0.30, vol: 0.22, slideTo: 90, release: 0.1 });
      noise({ dur: 0.25, vol: 0.16, hp: 200 });
    },
    lifeLost() {
      tone({ freq: 140, type: "square", dur: 0.4, vol: 0.25, slideTo: 60, release: 0.15 });
      noise({ dur: 0.3, vol: 0.18, hp: 120 });
    },
    start()  { tone({ freq: 440, type: "square", dur: 0.10, vol: 0.18, slideTo: 880 }); },
    over()   {
      // descending sad arpeggio
      const ac = ensure(); if (!ac) return;
      [660, 520, 400, 300].forEach((f, i) =>
        setTimeout(() => tone({ freq: f, type: "triangle", dur: 0.18, vol: 0.2 }), i * 130));
    },
  };
})();

/* ----------------------------------------------------------------
   4. INPUT
   ---------------------------------------------------------------- */
const keys = { left: false, right: false, fire: false };

window.addEventListener("keydown", (e) => {
  switch (e.code) {
    case "ArrowLeft":  case "KeyA": keys.left = true; break;
    case "ArrowRight": case "KeyD": keys.right = true; break;
    case "Space":
      keys.fire = true;
      e.preventDefault();
      handleSpace();
      break;
    case "KeyM": toggleMute(); break;
    case "Enter":
      if (state.screen !== SCREEN.PLAY) handleSpace();
      break;
  }
}, { passive: false });

window.addEventListener("keyup", (e) => {
  switch (e.code) {
    case "ArrowLeft":  case "KeyA": keys.left = false; break;
    case "ArrowRight": case "KeyD": keys.right = false; break;
    case "Space": keys.fire = false; break;
  }
});

// Space drives both "start/restart" and (during play) firing happens in update.
function handleSpace() {
  Audio.unlock();
  if (state.screen === SCREEN.TITLE) {
    startGame();
  } else if (state.screen === SCREEN.OVER) {
    startGame();
  }
}

// Pause on focus loss (nice-to-have)
let focused = true;
window.addEventListener("blur", () => { focused = false; });
window.addEventListener("focus", () => { focused = true; lastT = performance.now(); });

// Mute toggle
const muteBtn = document.getElementById("mute");
function toggleMute() {
  state.muted = !state.muted;
  muteBtn.textContent = state.muted ? "🔇 MUTED" : "🔊 SOUND";
  muteBtn.style.opacity = state.muted ? "0.6" : "1";
}
muteBtn.addEventListener("click", (e) => { e.preventDefault(); toggleMute(); Audio.unlock(); });

// Restart button
const restartBtn = document.getElementById("restartBtn");
restartBtn.addEventListener("click", (e) => { e.preventDefault(); Audio.unlock(); startGame(); });

/* ----------------------------------------------------------------
   5. ENTITIES & SPAWNING
   ---------------------------------------------------------------- */
let player = { x: VW / 2, y: CFG.player.y, w: CFG.player.w, h: CFG.player.h };

function startGame() {
  state.screen = SCREEN.PLAY;
  state.score = 0;
  state.combo = 0;
  state.lives = CFG.startLives;
  state.time = 0;
  state.spawnTimer = 0.5;
  state.fireTimer = 0;
  state.flash = 0;
  state.flashText = 0;
  state.shake = 0;
  state.newHigh = false;
  emails = [];
  bullets = [];
  particles = [];
  player.x = VW / 2;
  restartBtn.style.display = "none";
  Audio.start();
}

function currentSpawnInterval() {
  return Math.max(CFG.spawn.minInterval,
                  CFG.spawn.startInterval - state.time * CFG.spawn.rampPerSec);
}
function currentFallSpeed() {
  return Math.min(CFG.fall.maxSpeed,
                  CFG.fall.startSpeed + state.time * CFG.fall.rampPerSec);
}

function spawnEmail() {
  const isGreen = Math.random() < CFG.greenChance;
  const w = CFG.email.w, h = CFG.email.h;
  const x = 20 + Math.random() * (VW - 40 - w);
  const base = currentFallSpeed();
  const speed = base * (0.8 + Math.random() * 0.5);  // per-email variance
  emails.push({
    x, y: -h, w, h,
    vx: (Math.random() - 0.5) * 30,   // slight drift
    speed,
    phishing: !isGreen,
    wobble: Math.random() * Math.PI * 2,
    dead: false,
  });
}

function fireBullet() {
  bullets.push({
    x: player.x - CFG.bullet.w / 2,
    y: player.y - player.h / 2 - CFG.bullet.h,
    w: CFG.bullet.w,
    h: CFG.bullet.h,
  });
  Audio.shoot();
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 220;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.4,
      max: 0.9,
      color,
      size: 2 + Math.random() * 3,
    });
  }
}

// Background starfield
function initStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * VW,
      y: Math.random() * VH,
      speed: 10 + Math.random() * 40,
      size: Math.random() < 0.85 ? 1 : 2,
      c: Math.random() < 0.5 ? COLORS.cyan : COLORS.magenta,
      a: 0.2 + Math.random() * 0.5,
    });
  }
}
initStars();

/* ----------------------------------------------------------------
   6. UPDATE — game logic with delta time (dt in seconds)
   ---------------------------------------------------------------- */
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function addScore(pts) {
  state.score = Math.max(0, state.score + pts);
}

function comboMultiplier() {
  return Math.min(CFG.comboCap, Math.max(1, state.combo));
}

function update(dt) {
  // Update starfield always (background life on every screen)
  for (const s of stars) {
    s.y += s.speed * dt;
    if (s.y > VH) { s.y = 0; s.x = Math.random() * VW; }
  }

  // Decay visual effects
  if (state.flash > 0)     state.flash = Math.max(0, state.flash - dt * 2.2);
  if (state.flashText > 0) state.flashText = Math.max(0, state.flashText - dt);
  if (state.shake > 0)     state.shake = Math.max(0, state.shake - dt * 30);

  // Particles update on every screen for ambient pop
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.vy += 120 * dt; // light gravity
  }
  particles = particles.filter(p => p.life > 0);

  if (state.screen !== SCREEN.PLAY) return;

  state.time += dt;

  // --- Player movement ---
  let dir = 0;
  if (keys.left)  dir -= 1;
  if (keys.right) dir += 1;
  player.x += dir * CFG.player.speed * dt;
  const half = player.w / 2;
  player.x = Math.max(half + 8, Math.min(VW - half - 8, player.x));

  // --- Firing (rate-capped, supports hold) ---
  state.fireTimer -= dt;
  if (keys.fire && state.fireTimer <= 0) {
    fireBullet();
    state.fireTimer = CFG.bullet.cooldown;
  }

  // --- Spawning ---
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnEmail();
    state.spawnTimer = currentSpawnInterval() * (0.75 + Math.random() * 0.5);
  }

  // --- Bullets ---
  for (const b of bullets) b.y -= CFG.bullet.speed * dt;
  bullets = bullets.filter(b => b.y + b.h > 0);

  // --- Emails movement ---
  for (const em of emails) {
    em.y += em.speed * dt;
    em.wobble += dt * 2;
    em.x += em.vx * dt + Math.sin(em.wobble) * 6 * dt;
    em.x = Math.max(10, Math.min(VW - 10 - em.w, em.x));
  }

  // --- Bullet vs email collisions ---
  for (const b of bullets) {
    if (b.dead) continue;
    for (const em of emails) {
      if (em.dead) continue;
      if (rectsOverlap(b, em)) {
        b.dead = true;
        em.dead = true;
        if (em.phishing) {
          // Correct shot
          state.combo += 1;
          const mult = comboMultiplier();
          addScore(100 * mult);
          spawnParticles(em.x + em.w / 2, em.y + em.h / 2, COLORS.red, 18);
          state.shake = Math.min(8, 3 + mult);
          Audio.hitRed(state.combo);
        } else {
          // FALSE POSITIVE — shot a legit email
          state.combo = 0;
          addScore(-150);
          state.flash = 1;
          state.flashText = 1.1;
          state.shake = 10;
          spawnParticles(em.x + em.w / 2, em.y + em.h / 2, COLORS.lime, 16);
          Audio.hitGreen();
        }
        break;
      }
    }
  }

  // --- Emails reaching the bottom ---
  for (const em of emails) {
    if (em.dead) continue;
    if (em.y > VH) {
      em.dead = true;
      if (em.phishing) {
        // Failed to block a phishing email -> lose a life
        state.lives -= 1;
        state.combo = 0;
        state.flash = 0.8;
        state.shake = 12;
        spawnParticles(em.x + em.w / 2, VH - 10, COLORS.red, 22);
        if (state.lives <= 0) {
          gameOver();
        } else {
          Audio.lifeLost();
        }
      }
      // green reaching bottom: correctly ignored, no penalty
    }
  }

  // Cleanup dead entities
  bullets = bullets.filter(b => !b.dead);
  emails  = emails.filter(em => !em.dead);
}

function gameOver() {
  Audio.lifeLost();
  setTimeout(() => Audio.over(), 200);
  state.screen = SCREEN.OVER;
  if (state.score > state.high) {
    state.high = state.score;
    state.newHigh = true;
    saveHigh();
  }
  restartBtn.style.display = "block";
}

/* ----------------------------------------------------------------
   7. RENDER

   The look is "fake 3D": all art is still drawn on the 2D canvas, but a
   consistent top-left light direction plus extrusion, bevels, gradients,
   and shaded spheres make shapes read as solid objects with depth.
   Gameplay/hitboxes are unaffected — this is purely cosmetic.
   ---------------------------------------------------------------- */

// --- Color utilities (parse #rrggbb, then lighten/darken or add alpha) ---
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  return {
    r: parseInt(h.substring(0, 2), 16),
    g: parseInt(h.substring(2, 4), 16),
    b: parseInt(h.substring(4, 6), 16),
  };
}
// amt > 0 lightens toward white, amt < 0 darkens toward black (range -1..1)
function shade(hex, amt) {
  const { r, g, b } = hexToRgb(hex);
  const mix = (c) => amt >= 0
    ? Math.round(c + (255 - c) * amt)
    : Math.round(c * (1 + amt));
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
function rgba(hex, a) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

// 3D block text: draw dark extrusion layers stepping down-right, then the face.
function extrudeText(text, x, y, color, size, depth, align = "center", weight = "bold") {
  ctx.save();
  ctx.font = `${weight} ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  // extruded side faces (no blur, darkened) from far to near
  ctx.shadowBlur = 0;
  for (let i = depth; i >= 1; i--) {
    ctx.fillStyle = shade(color, -0.55);
    ctx.fillText(text, x + i, y + i);
  }
  // glowing front face
  ctx.shadowColor = color;
  ctx.shadowBlur = size * 0.4;
  ctx.fillStyle = shade(color, 0.15);
  ctx.fillText(text, x, y);
  // top-left specular highlight edge
  ctx.shadowBlur = 0;
  ctx.fillStyle = rgba("#ffffff", 0.25);
  ctx.fillText(text, x - 1, y - 1);
  ctx.restore();
}

// Shaded sphere: radial gradient with a top-left highlight -> volumetric look.
function shadeSphere(x, y, r, color) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, shade(color, 0.7));
  g.addColorStop(0.45, color);
  g.addColorStop(1, shade(color, -0.6));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

// Embossed HUD panel: dark rounded fill with light top edge + dark bottom edge.
function bevelPanel(x, y, w, h, color) {
  const r = 6;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, rgba(color, 0.22));
  g.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = g;
  ctx.fill();
  // top highlight
  ctx.strokeStyle = rgba(color, 0.6);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + r, y + 0.5);
  ctx.lineTo(x + w - r, y + 0.5);
  ctx.stroke();
  // bottom shadow
  ctx.strokeStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();
  ctx.moveTo(x + r, y + h - 0.5);
  ctx.lineTo(x + w - r, y + h - 0.5);
  ctx.stroke();
  ctx.restore();
}

function glowRect(x, y, w, h, color, blur) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function glowText(text, x, y, color, size, blur, align = "center", weight = "bold") {
  ctx.save();
  ctx.font = `${weight} ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Draw an envelope as an extruded 3D-looking object.
// The lit front face stays aligned to the logical x,y,w,h so the hitbox
// (used by collisions) is unchanged — depth is drawn behind/around it.
function drawEnvelope(x, y, w, h, color) {
  const d = 6; // extrusion depth toward lower-right
  ctx.save();

  // soft contact shadow on the playfield (offset down-right, blurred)
  ctx.shadowColor = "rgba(0,0,0,0.55)";
  ctx.shadowBlur = 8;
  ctx.shadowOffsetX = 5;
  ctx.shadowOffsetY = 7;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(x, y, w, h);
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  // extruded right + bottom faces (darkened, no glow) to imply thickness
  ctx.shadowBlur = 0;
  ctx.fillStyle = shade(color, -0.55);
  ctx.beginPath();
  ctx.moveTo(x + w, y);
  ctx.lineTo(x + w + d, y + d);
  ctx.lineTo(x + w + d, y + h + d);
  ctx.lineTo(x + d, y + h + d);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  ctx.fill();

  // front face: vertical gradient, lit at top -> shaded at bottom
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  const fg = ctx.createLinearGradient(0, y, 0, y + h);
  fg.addColorStop(0, shade(color, -0.15));
  fg.addColorStop(0.5, shade(color, -0.55));
  fg.addColorStop(1, shade(color, -0.7));
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, w, h);
  // bright neon outline
  ctx.shadowBlur = 10;
  ctx.strokeStyle = shade(color, 0.2);
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // folded flap: two triangles with different shading (a crease catches light)
  ctx.shadowBlur = 0;
  const midY = y + h * 0.55;
  ctx.beginPath(); // left half (lit)
  ctx.moveTo(x, y);
  ctx.lineTo(x + w / 2, midY);
  ctx.lineTo(x + w / 2, y);
  ctx.closePath();
  ctx.fillStyle = rgba(color, 0.45);
  ctx.fill();
  ctx.beginPath(); // right half (shaded)
  ctx.moveTo(x + w, y);
  ctx.lineTo(x + w / 2, midY);
  ctx.lineTo(x + w / 2, y);
  ctx.closePath();
  ctx.fillStyle = rgba(color, 0.2);
  ctx.fill();
  // flap edge lines
  ctx.strokeStyle = shade(color, 0.3);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w / 2, midY);
  ctx.lineTo(x + w, y);
  ctx.stroke();

  // top-edge specular highlight
  ctx.strokeStyle = rgba("#ffffff", 0.35);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 1, y + 1);
  ctx.lineTo(x + w - 1, y + 1);
  ctx.stroke();

  ctx.restore();
}

// Player ship: neon shield/cannon
function drawPlayer() {
  const x = player.x, y = player.y, w = player.w, h = player.h;
  ctx.save();
  ctx.translate(x, y);
  // hull silhouette path (reused for fill + stroke)
  const hull = () => {
    ctx.beginPath();
    ctx.moveTo(-w/2, h/2);
    ctx.lineTo(-w/2, 0);
    ctx.quadraticCurveTo(-w/2, -h/2, 0, -h/2);
    ctx.quadraticCurveTo(w/2, -h/2, w/2, 0);
    ctx.lineTo(w/2, h/2);
    ctx.closePath();
  };

  // extruded base lip (darkened slab under the hull -> sits on a surface)
  ctx.shadowBlur = 0;
  ctx.fillStyle = shade(COLORS.cyan, -0.7);
  ctx.fillRect(-w/2, h/2 - 3, w, 6);

  // hull body: vertical metallic gradient (bright top -> dark belly)
  ctx.shadowColor = COLORS.cyan;
  ctx.shadowBlur = 16;
  const bg = ctx.createLinearGradient(0, -h/2, 0, h/2);
  bg.addColorStop(0, shade(COLORS.cyan, 0.5));
  bg.addColorStop(0.45, shade(COLORS.cyan, -0.4));
  bg.addColorStop(1, shade(COLORS.cyan, -0.75));
  ctx.fillStyle = bg;
  hull();
  ctx.fill();
  // neon rim
  ctx.strokeStyle = shade(COLORS.cyan, 0.3);
  ctx.lineWidth = 2.5;
  hull();
  ctx.stroke();

  // cannon barrel with a vertical specular streak
  ctx.shadowBlur = 6;
  const cg = ctx.createLinearGradient(-4, 0, 4, 0);
  cg.addColorStop(0, shade(COLORS.cyan, -0.4));
  cg.addColorStop(0.5, shade(COLORS.cyan, 0.7));
  cg.addColorStop(1, shade(COLORS.cyan, -0.4));
  ctx.fillStyle = cg;
  ctx.fillRect(-4, -h/2 - 12, 8, 14);

  // glossy magenta core (shaded sphere reads as a domed light)
  ctx.shadowColor = COLORS.magenta;
  ctx.shadowBlur = 12;
  shadeSphere(0, 0, 7, COLORS.magenta);
  ctx.restore();
}

function drawBackground() {
  // base
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, VW, VH);

  // stars: size + brightness already vary, giving a parallax depth field.
  // Bigger/brighter stars read as "closer".
  for (const s of stars) {
    ctx.save();
    ctx.globalAlpha = s.a;
    ctx.shadowColor = s.c;
    ctx.shadowBlur = 4 + s.size * 3;
    ctx.fillStyle = s.c;
    ctx.fillRect(s.x, s.y, s.size, s.size);
    ctx.restore();
  }

  // Perspective floor grid: lines converge to a vanishing point on the
  // horizon, creating a sense of a 3D ground plane receding into the screen.
  const t = performance.now() / 1000;
  const horizon = VH * 0.5;          // where the floor "starts"
  const vpX = VW / 2;                // vanishing point x
  ctx.save();
  ctx.strokeStyle = "rgba(0,240,255,0.10)";
  ctx.lineWidth = 1;
  // converging vertical rails
  for (let i = -6; i <= 6; i++) {
    const baseX = vpX + i * (VW / 6);
    ctx.beginPath();
    ctx.moveTo(vpX, horizon);
    ctx.lineTo(baseX, VH);
    ctx.stroke();
  }
  // horizontal rungs spaced by perspective, scrolling toward the viewer
  ctx.strokeStyle = "rgba(255,47,208,0.08)";
  for (let i = 0; i < 14; i++) {
    // exponential spacing + slow scroll for motion
    const f = ((i + (t * 0.4) % 1) / 14);
    const yy = horizon + (VH - horizon) * (f * f);
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(VW, yy);
    ctx.stroke();
  }
  ctx.restore();

  // bottom "defense line" -> a glowing 3D rail (bright core + soft glow band)
  ctx.save();
  ctx.shadowColor = COLORS.cyan;
  ctx.shadowBlur = 14;
  ctx.fillStyle = rgba(COLORS.cyan, 0.5);
  ctx.fillRect(0, VH - 31, VW, 3);
  ctx.fillStyle = rgba(COLORS.cyan, 0.12);
  ctx.fillRect(0, VH - 28, VW, 6);
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.max);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    // shaded sphere instead of a flat square -> bursts look volumetric
    shadeSphere(p.x, p.y, p.size + 1, p.color);
    ctx.restore();
  }
}

function drawHUD() {
  // Embossed HUD panels behind each readout for a paneled cockpit feel
  bevelPanel(10, 10, 140, 50, COLORS.cyan);
  bevelPanel(VW/2 - 80, 10, 160, 50, COLORS.magenta);
  bevelPanel(VW - 150, 10, 140, 50, COLORS.lime);

  // Score (left) — extruded numerals
  glowText("SCORE", 22, 24, COLORS.cyan, 14, 8, "left");
  extrudeText(String(state.score).padStart(6, "0"), 22, 47, COLORS.white, 24, 3, "left");

  // High score (center)
  glowText("HIGH", VW/2, 24, COLORS.magenta, 14, 8, "center");
  extrudeText(String(state.high).padStart(6, "0"), VW/2, 47, COLORS.magenta, 22, 3, "center");

  // Combo (right area, under high)
  const mult = comboMultiplier();
  if (state.combo >= 2) {
    const pulse = 1 + 0.08 * Math.sin(performance.now() / 90);
    ctx.save();
    ctx.translate(VW/2, 78);
    ctx.scale(pulse, pulse);
    glowText(`COMBO x${mult}`, 0, 0, COLORS.amber, 20, 14, "center");
    ctx.restore();
  }

  // Lives (right) as small ship icons
  glowText("LIVES", VW - 18, 24, COLORS.lime, 14, 8, "right");
  for (let i = 0; i < state.lives; i++) {
    const lx = VW - 24 - i * 26;
    drawMiniLife(lx, 44);
  }
}

function drawMiniLife(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.shadowColor = COLORS.lime;
  ctx.shadowBlur = 8;
  // gradient gives the little ship a lit-top / dark-bottom 3D facet
  const g = ctx.createLinearGradient(0, -7, 0, 6);
  g.addColorStop(0, shade(COLORS.lime, 0.5));
  g.addColorStop(1, shade(COLORS.lime, -0.55));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-9, 6);
  ctx.lineTo(0, -7);
  ctx.lineTo(9, 6);
  ctx.closePath();
  ctx.fill();
  // top-edge highlight
  ctx.shadowBlur = 0;
  ctx.strokeStyle = rgba("#ffffff", 0.4);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-9, 6);
  ctx.lineTo(0, -7);
  ctx.stroke();
  ctx.restore();
}

function drawFlash() {
  if (state.flash > 0) {
    ctx.save();
    ctx.globalAlpha = state.flash * 0.5;
    ctx.fillStyle = COLORS.red;
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  }
  if (state.flashText > 0) {
    const a = Math.min(1, state.flashText);
    ctx.save();
    ctx.globalAlpha = a;
    glowText("FALSE POSITIVE!", VW/2, VH/2 - 40, COLORS.red, 40, 20, "center");
    glowText("-150  COMBO LOST", VW/2, VH/2 + 4, COLORS.white, 18, 10, "center");
    ctx.restore();
  }
}

// --- Screens ---
function drawTitle() {
  // big title
  const t = performance.now() / 1000;
  const bob = Math.sin(t * 1.4) * 6;
  extrudeText("PHISH", VW/2, 180 + bob, COLORS.red, 84, 7, "center");
  extrudeText("INVADERS", VW/2, 268 + bob, COLORS.cyan, 70, 6, "center");

  // decorative envelopes
  drawEnvelope(VW/2 - 150, 330, 40, 30, COLORS.red);
  drawEnvelope(VW/2 + 110, 330, 40, 30, COLORS.lime);

  glowText("Defend the inbox!", VW/2, 400, COLORS.magenta, 22, 12, "center");

  const lines = [
    "← →  or  A / D   MOVE",
    "SPACE   FIRE",
    "",
    "SHOOT the RED phishing mail",
    "SPARE the GREEN legit mail",
  ];
  let y = 450;
  for (const ln of lines) {
    glowText(ln, VW/2, y, COLORS.white, 18, 6, "center", "normal");
    y += 30;
  }

  glowText("HIGH SCORE  " + String(state.high).padStart(6, "0"),
           VW/2, y + 20, COLORS.amber, 20, 12, "center");

  // blinking prompt
  if (Math.floor(t * 2) % 2 === 0) {
    glowText("PRESS SPACE TO START", VW/2, VH - 120, COLORS.lime, 28, 16, "center");
  }
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = "rgba(5,5,12,0.78)";
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();

  const t = performance.now() / 1000;
  extrudeText("GAME OVER", VW/2, 200, COLORS.red, 64, 6, "center");

  if (state.newHigh) {
    if (Math.floor(t * 3) % 2 === 0) {
      glowText("NEW HIGH SCORE!", VW/2, 280, COLORS.amber, 34, 20, "center");
    }
  }

  glowText("FINAL SCORE", VW/2, 350, COLORS.cyan, 22, 12, "center");
  extrudeText(String(state.score).padStart(6, "0"), VW/2, 392, COLORS.white, 44, 5, "center");

  glowText("HIGH SCORE  " + String(state.high).padStart(6, "0"),
           VW/2, 450, COLORS.magenta, 20, 12, "center");

  // (HTML restart button is shown over this; also key restart)
  glowText("press SPACE to play again", VW/2, VH - 70, COLORS.white, 16, 6, "center", "normal");
}

function render() {
  // Screen shake offset
  let ox = 0, oy = 0;
  if (state.shake > 0) {
    ox = (Math.random() - 0.5) * state.shake;
    oy = (Math.random() - 0.5) * state.shake;
  }
  ctx.save();
  ctx.translate(ox, oy);

  drawBackground();

  if (state.screen === SCREEN.PLAY || state.screen === SCREEN.OVER) {
    // emails
    for (const em of emails) {
      drawEnvelope(em.x, em.y, em.w, em.h, em.phishing ? COLORS.red : COLORS.lime);
    }
    // bullets
    for (const b of bullets) glowRect(b.x, b.y, b.w, b.h, COLORS.cyan, 12);
    // player
    drawPlayer();
    // particles
    drawParticles();
  }

  if (state.screen === SCREEN.PLAY) {
    drawHUD();
    drawFlash();
  }

  if (state.screen === SCREEN.TITLE) {
    drawParticles();
    drawTitle();
  }

  if (state.screen === SCREEN.OVER) {
    drawGameOver();
  }

  ctx.restore();
}

/* ----------------------------------------------------------------
   8. MAIN LOOP & BOOT
   ---------------------------------------------------------------- */
let lastT = performance.now();

function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  // Clamp dt (tab switches, lag) for stability
  if (dt > 0.05) dt = 0.05;

  // Pause when window not focused (skip update; keep rendering last frame)
  if (focused) {
    update(dt);
  }
  render();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
